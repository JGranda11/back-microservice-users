server:
  port: 8081

spring:
  application:
    name: msvc_users

  datasource:
    url: jdbc:postgresql://localhost:5432/users
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

jwt:
  secret_key: e6JZY/j6nCYnVhABekGIkOB2OtkPsvXCbcYrhKp+z+g=
  expiration_time: 3600000



allowed-origins:
  http://localhost:3000/,
  http://localhost:5173/,